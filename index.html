<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Pengiriman - TNXUS CLUB</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
    :root{--brand:#111;--accent:#d4af37;--line:#e0e0e0;--success:#2e7d32}
    body{background:#f8f7f4;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .container{background:#fff;padding:32px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.06);width:100%;max-width:440px}
    h2{text-align:center;color:var(--brand);margin-bottom:24px;font-weight:600}
    .input-group{margin-bottom:20px}
    label{display:block;margin-bottom:8px;color:#444;font-size:14px}
    input{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:8px;font-size:15px}
    button{width:100%;padding:13px;background:var(--brand);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;transition:background .2s}
    button:hover{background:#333}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:999}
    .modal.active{display:flex}
    .modal-box{background:#fff;padding:28px;border-radius:12px;width:100%;max-width:360px}
    .modal-box h3{margin-bottom:16px;text-align:center}
    .pin-inputs{display:flex;gap:10px;justify-content:center;margin:20px 0}
    .pin-inputs input{width:50px;height:56px;text-align:center;font-size:22px;padding:0;border:1px solid #ddd;border-radius:8px}
    .btn-group{display:flex;gap:10px;margin-top:10px}
    .btn-group button{flex:1}
    .btn-cancel{background:#eee;color:#333}
    .btn-cancel:hover{background:#ddd}
    
    /* === TIMELINE RIWAYAT === */
    .hasil-wrapper{display:none;margin-top:24px}
    .hasil-wrapper.show{display:block}
    .resi-header{background:#f5f5f5;padding:14px;border-radius:8px;margin-bottom:20px}
    .resi-header p{font-size:14px;color:#555}
    .resi-header strong{color:var(--brand);font-size:16px}
    .timeline{position:relative;padding-left:28px}
    .timeline::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
    .timeline-item{position:relative;margin-bottom:20px}
    .timeline-dot{position:absolute;left:-28px;top:4px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--line)}
    .timeline-item.terkini .timeline-dot{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px rgba(212,175,55,.15)}
    .timeline-item.selesai .timeline-dot{border-color:var(--success);background:var(--success)}
    .timeline-date{font-size:13px;color:#888;margin-bottom:3px}
    .timeline-loc{font-weight:600;color:var(--brand);font-size:15px}
    .timeline-desc{font-size:14px;color:#555;margin-top:2px;line-height:1.5}
    
    .error{color:#d32f2f;margin-top:12px;font-size:14px;text-align:center}
    .loading{text-align:center;margin-top:12px;color:#555;display:none}
  </style>
</head>
<body>

<div class="container">
  <h2>Cek Riwayat Pengiriman</h2>
  
  <div class="input-group">
    <label for="resi">Masukkan Nomor Resi</label>
    <input type="text" id="resi" placeholder="Contoh: TNX123456" autocomplete="off">
  </div>
  
  <button id="btnCari">Lihat Riwayat</button>
  
  <div class="loading" id="loadingMsg">Mengambil data perjalanan...</div>
  <div class="error" id="errorMsg"></div>
  
  <!-- Hasil Riwayat -->
  <div class="hasil-wrapper" id="hasil">
    <div class="resi-header">
      <p>Nomor Resi</p>
      <strong id="noResiTampil"></strong>
    </div>
    <div class="timeline" id="timelineList">
      <!-- Diisi otomatis lewat JS -->
    </div>
  </div>
</div>

<!-- Popup PIN 4 Digit -->
<div class="modal" id="modalPin">
  <div class="modal-box">
    <h3>Konfirmasi Kode</h3>
    <p style="text-align:center;color:#666;font-size:14px">Masukkan kode 4 digit yang diberikan</p>
    <div class="pin-inputs">
      <input type="text" maxlength="1" class="pin-box" inputmode="numeric">
      <input type="text" maxlength="1" class="pin-box" inputmode="numeric">
      <input type="text" maxlength="1" class="pin-box" inputmode="numeric">
      <input type="text" maxlength="1" class="pin-box" inputmode="numeric">
    </div>
    <div class="error" id="pinError"></div>
    <div class="btn-group">
      <button class="btn-cancel" id="btnBatal">Batal</button>
      <button id="btnKonfirmasi">Lihat Data</button>
    </div>
  </div>
</div>

<script>
// === GANTI DENGAN URL APPS SCRIPT KAMU ===
const API_URL = "https://script.google.com/macros/s/AKfycbyi50m5qlvWDGoPkMOdWcYeXdvn3tJJgNpRQJuA_4n7FwmZcaFSnLCjKM9GxDKrBzpOoQ/exec";
// ============================================

let dataResi = null;
const elResi = document.getElementById('resi');
const btnCari = document.getElementById('btnCari');
const modalPin = document.getElementById('modalPin');
const btnBatal = document.getElementById('btnBatal');
const btnKonfirmasi = document.getElementById('btnKonfirmasi');
const hasil = document.getElementById('hasil');
const errorMsg = document.getElementById('errorMsg');
const loadingMsg = document.getElementById('loadingMsg');
const pinBoxes = document.querySelectorAll('.pin-box');
const timelineList = document.getElementById('timelineList');
const noResiTampil = document.getElementById('noResiTampil');

// Fokus PIN
pinBoxes.forEach((box, idx) => {
  box.addEventListener('input', () => {
    if (box.value && idx < 3) pinBoxes[idx + 1].focus();
  });
  box.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !box.value && idx > 0) pinBoxes[idx - 1].focus();
  });
});

btnCari.addEventListener('click', async () => {
  const resiVal = elResi.value.trim();
  if (!resiVal) {
    errorMsg.textContent = "Masukkan nomor resi terlebih dahulu";
    return;
  }
  
  errorMsg.textContent = "";
  hasil.classList.remove('show');
  loadingMsg.style.display = "block";
  
  try {
    const res = await fetch(`${API_URL}?resi=${encodeURIComponent(resiVal)}`);
    const json = await res.json();
    loadingMsg.style.display = "none";
    
    if (!json.found) {
      errorMsg.textContent = "Nomor resi tidak ditemukan";
      return;
    }
    
    dataResi = json;
    modalPin.classList.add('active');
    pinBoxes[0].focus();
    
  } catch (err) {
    loadingMsg.style.display = "none";
    errorMsg.textContent = "Kesalahan jaringan, coba lagi";
    console.error(err);
  }
});

btnKonfirmasi.addEventListener('click', () => {
  const pin = Array.from(pinBoxes).map(b => b.value).join('');
  document.getElementById('pinError').textContent = "";
  
  if (pin.length !== 4) {
    document.getElementById('pinError').textContent = "Masukkan 4 digit kode";
    return;
  }
  
  if (pin === dataResi.password) {
    // Tampilkan riwayat
    modalPin.classList.remove('active');
    pinBoxes.forEach(b => b.value = "");
    
    noResiTampil.textContent = elResi.value.trim();
    
    // Buat daftar riwayat
    timelineList.innerHTML = "";
    const total = dataResi.riwayat.length;
    
    dataResi.riwayat.forEach((item, index) => {
      const isTerakhir = index === total - 1;
      const isSelesai = item.keterangan.includes("diterima") || item.keterangan.includes("✅");
      
      const div = document.createElement('div');
      div.className = `timeline-item ${isTerakhir ? 'terkini' : ''} ${isSelesai ? 'selesai' : ''}`;
      div.innerHTML = `
        <div class="timeline-dot"></div>
        <div class="timeline-date">${item.tanggal} • ${item.waktu}</div>
        <div class="timeline-loc">${item.lokasi}</div>
        <div class="timeline-desc">${item.keterangan}</div>
      `;
      timelineList.appendChild(div);
    });
    
    hasil.classList.add('show');
    
  } else {
    document.getElementById('pinError').textContent = "Kode salah, coba lagi";
    pinBoxes.forEach(b => b.value = "");
    pinBoxes[0].focus();
  }
});

btnBatal.addEventListener('click', () => {
  modalPin.classList.remove('active');
  pinBoxes.forEach(b => b.value = "");
  dataResi = null;
});

modalPin.addEventListener('click', (e) => {
  if (e.target === modalPin) {
    modalPin.classList.remove('active');
    pinBoxes.forEach(b => b.value = "");
  }
});
</script>
</body>
</html>
